name: Code Quality

on:
  push:
  pull_request:
  workflow_dispatch:

# Each job copies its output into the run summary, which is readable on the
# run page without signing in to GitHub (raw logs are not).
jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: |
          set -o pipefail
          cargo fmt -- --check 2>&1 | tee fmt.txt || status=$?
          { echo '### rustfmt'; echo '```diff'; cat fmt.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

  lint:
    name: Clippy Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.txt || status=$?
          { echo '### clippy'; echo '```'; grep -v '^ *Compiling\|^ *Checking\|^ *Downloaded\|^ *Downloading' clippy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

  check:
    name: Check Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check code compiles
        run: |
          set -o pipefail
          cargo check --all-targets --all-features 2>&1 | tee check.txt || status=$?
          { echo '### cargo check'; echo '```'; grep -v '^ *Compiling\|^ *Checking\|^ *Downloaded\|^ *Downloading' check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}
