name: Code Quality

on:
  push:
  pull_request:
  workflow_dispatch:

# Each job turns its output into annotations and a step summary (see
# .github/publish-log.sh) so failures can be read without signing in.
env:
  CARGO_TERM_COLOR: never

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: |
          set +e
          cargo fmt -- --check 2>&1 | tee fmt.txt; status=${PIPESTATUS[0]}
          bash .github/publish-log.sh fmt.txt rustfmt "$status"
          exit "$status"

  lint:
    name: Clippy Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.txt; status=${PIPESTATUS[0]}
          bash .github/publish-log.sh clippy.txt clippy "$status"
          exit "$status"

  check:
    name: Check Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check code compiles
        run: |
          set +e
          cargo check --all-targets --all-features 2>&1 | tee check.txt; status=${PIPESTATUS[0]}
          bash .github/publish-log.sh check.txt "cargo check" "$status"
          exit "$status"
