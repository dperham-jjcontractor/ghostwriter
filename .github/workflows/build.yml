name: Build rm2 binary

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-host:
    name: Host tests (x86_64 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests (framebuffer skip table, ASCII fold, config precedence)
        run: cargo test --lib

  build-rm2:
    name: Build ghostwriter-rm2 (armv7, reMarkable 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
      # cross 0.2.5's armv7 image is Ubuntu 16.04 (glibc 2.23), so the binary starts on every rM2 3.x
      # firmware (3.7 and 3.2x alike). Do NOT use cross from git main: its image is Ubuntu 24.04 and the
      # tablet will say 'GLIBC_2.3x not found'. This is the same path upstream's working release used.
      - name: Install cross 0.2.5
        run: cargo install cross --version 0.2.5 --locked
      - name: Build
        run: cross build --release --target armv7-unknown-linux-gnueabihf
      - name: Package
        run: |
          cp target/armv7-unknown-linux-gnueabihf/release/ghostwriter ghostwriter-rm2
          sha256sum ghostwriter-rm2 | tee ghostwriter-rm2.sha256
      - name: Upload artifact (every push)
        uses: actions/upload-artifact@v4
        with:
          name: ghostwriter-rm2
          path: |
            ghostwriter-rm2
            ghostwriter-rm2.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ghostwriter-rm2
            ghostwriter-rm2.sha256

# Owner flow: GitHub > Actions > latest green run > Artifacts > ghostwriter-rm2 (zip) > unzip > .\deploy.ps1 -Binary .\ghostwriter-rm2
# The zip loses the exec bit; install.sh chmods it.
